name: OpenXzuff UI Runtime, OS Contracts and 3D
on:
  push:
    paths:
      - "Kernel/**"
      - "sys/**"
      - "user/**"
      - "gui/**"
      - "tests/**"
      - "language/**"
      - "CMakeLists.txt"
      - "runtime/**"
      - "graphics3d/**"
      - ".github/workflows/luau-runtime.yml"
  pull_request:
    paths:
      - "Kernel/**"
      - "sys/**"
      - "user/**"
      - "gui/**"
      - "tests/**"
      - "language/**"
      - "CMakeLists.txt"
      - "runtime/**"
      - "graphics3d/**"
      - ".github/workflows/luau-runtime.yml"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Configure OS contract smoke tests
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build OS contract smoke tests and Xzuff Go compiler
        run: cmake --build build --parallel 2
      - name: Run OS contracts, Xzuff Go compiler and Coder Checker tests
        run: ctest --test-dir build --output-on-failure
      - name: Compile Xzuff Go Gravity Kernel .xexe fixture
        run: |
          ./build/xzuff-go language/xzuff-go/tests/return_42.xgo build/return_42.xexe
          ./build/xexe-loader-test build/return_42.xexe
          test "$(wc -c < build/return_42.xexe)" -gt 32
          test "$(od -An -tx1 -N8 build/return_42.xexe | awk '{ $1=$1; gsub(/ /, ""); print }')" = "585a584558453100"
      - name: Install Android NDK for ARM64
        uses: android-actions/setup-android@v3
      - name: Install Android NDK package
        run: sdkmanager "ndk;27.2.12479018"
      - name: Cross-compile Xzuff Go / xgo for Android ARM64
        run: |
          set -eu
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S . -B build-android-arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-24 \
            -DANDROID_STL=c++_static
          cmake --build build-android-arm64 --parallel 2 --target xgo xzuff-go xzuff-check
      - name: Package Android ARM64 Xzuff Go toolchain
        run: |
          set -eu
          DIST="dist/xzuff-go-toolchain-android-arm64"
          mkdir -p "$DIST/bin" "$DIST/examples"
          install -m 0755 build-android-arm64/xgo "$DIST/bin/xgo"
          install -m 0755 build-android-arm64/xzuff-go "$DIST/bin/xzuff-go"
          install -m 0755 build-android-arm64/xzuff-check "$DIST/bin/xzuff-check"
          install -m 0644 language/xzuff-go/tests/return_42.xgo "$DIST/examples/return_42.xgo"
          install -m 0644 build/return_42.xexe "$DIST/examples/return_42.xexe"
          cat > "$DIST/README.txt" <<'EOF'
          OpenXzuff UI 1.0 - Xzuff Go / xgo Android ARM64 toolchain

          Target: Android ARM64 (arm64-v8a), Android API 24+.
          These binaries are Android host tools, not Linux x86_64 binaries.
          xgo is the project CLI; xzuff-go is the compiler; xzuff-check is the source checker.
          Keep all three executables together in bin/ because xgo invokes its sibling tools.

          Run in an Android environment that permits native executable execution, such as a
          compatible terminal environment. Android device policy and filesystem permissions
          may affect execution; this package is not an APK and does not install like an app.

          Commands:
            ./bin/xgo --help
            ./bin/xgo create MyProject
            ./bin/xgo check
            ./bin/xgo run
            ./bin/xgo build

          Example source: examples/return_42.xgo
          Example .xexe: examples/return_42.xexe
          Note: .xexe is a Gravity Kernel RV64 output format, not an Android executable.
          EOF
          file "$DIST/bin/xgo" "$DIST/bin/xzuff-go" "$DIST/bin/xzuff-check"
          zip -qr dist/xzuff-go-toolchain-android-arm64.zip "$DIST"
      - name: Configure Luau runtime
        run: cmake -S runtime -B runtime/build -DCMAKE_BUILD_TYPE=Release
      - name: Build Luau runtime
        run: cmake --build runtime/build --parallel 2
      - name: Run Luau source smoke test
        run: runtime/build/xzuff-luau runtime/examples/hello.luau
      - name: Luau package smoke test
        run: |
          runtime/build/xzuff-luau --pack runtime/examples/hello.luau runtime/build/hello.luap "Hello Game" 1.0.0
          runtime/build/xzuff-luau runtime/build/hello.luap
      - name: Configure OpenXzuff3D
        run: cmake -S graphics3d -B graphics3d/build -DCMAKE_BUILD_TYPE=Release
      - name: Build OpenXzuff3D
        run: cmake --build graphics3d/build --parallel 2
      - name: Test OpenXzuff3D geometry, transforms, and render
        run: ctest --test-dir graphics3d/build --output-on-failure
      - name: Render 3D scene smoke test
        run: graphics3d/build/xzuff3d-cube graphics3d/build/scene.ppm
      - name: Verify rendered image
        run: test -s graphics3d/build/scene.ppm
      - name: Upload OpenXzuff UI smoke-test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openxzuff-ui-1.0-smoke-artifacts
          path: |
            build/xgo
            dist/xzuff-go-toolchain-android-arm64.zip
            build/xzuff-go
            build/xzuff-check
            build/openxzuff-os-smoke
            build/xexe-loader-test
            build/return_42.xexe
            build/CliSmoke/build/CliSmoke.xexe
            runtime/build/xzuff-luau
            runtime/build/hello.luap
            graphics3d/build/xzuff3d-cube
            graphics3d/build/scene.ppm
          if-no-files-found: warn
          retention-days: 14
