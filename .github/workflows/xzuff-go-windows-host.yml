name: Xzuff Go Windows Host Smoke

on:
  push:
    paths:
      - "language/xzuff-go/**"
      - "Kernel/include/openxzuff/kernel/xexe_loader.hpp"
      - "Kernel/src/xexe_loader.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/xzuff-go-windows-host.yml"
  pull_request:
    paths:
      - "language/xzuff-go/**"
      - "Kernel/include/openxzuff/kernel/xexe_loader.hpp"
      - "Kernel/src/xexe_loader.cpp"
      - "CMakeLists.txt"
      - ".github/workflows/xzuff-go-windows-host.yml"
  workflow_dispatch:

jobs:
  windows-host:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build
      - name: Build Xzuff Go host tools and .xexe validator
        run: cmake --build build --config Release --parallel 2 --target xgo xzuff-go xzuff-check xexe-loader-test
      - name: Run compiler, CLI, and .xexe tests
        run: >-
          ctest --test-dir build -C Release --output-on-failure
          -R "^(xzuff-go-codegen-self-test|xgo-cli-help|xgo-cli-command-smoke|xzuff-check-valid-source|xzuff-check-json-output|xzuff-check-rejects-out-of-range-i32|gravity-xexe-validation|xzuff-go-compile-fixture|xzuff-go-xexe-validation)$"
