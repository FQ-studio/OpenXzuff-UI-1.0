name: RV64 QEMU boot smoke test

on:
  push:
    branches: [main, "feat/lua-native-gui-foundation"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qemu-rv64-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RV64 cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-riscv64-unknown-elf qemu-system-misc
      - name: Test bounded boot allocator
        run: make check-boot-alloc
      - name: Test physical memory map
        run: make check-memory-map
      - name: Test FDT memory discovery
        run: make check-fdt
      - name: Build RV64 payload
        run: make clean kernel-rv64 RISCV_PREFIX=riscv64-unknown-elf-
      - name: Boot through OpenSBI in QEMU
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-riscv64 \
            -machine virt -nographic -bios default \
            -kernel build/openxzuff-rv64.elf > qemu-boot.log 2>&1
          status=$?
          set -e
          # The kernel deliberately waits forever after printing its boot status.
          if [ "$status" -ne 124 ]; then
            cat qemu-boot.log
            echo "QEMU did not remain in the expected kernel idle loop (exit $status)."
            exit 1
          fi
          cat qemu-boot.log
          grep -F "OpenXzuff UI native kernel: RV64 entry reached." qemu-boot.log
          grep -F "Gravity FDT RAM discovery: PASS; usable bytes=" qemu-boot.log
          grep -F "Gravity boot allocator: initialized from reserved-safe RAM range." qemu-boot.log
          grep -F "Gravity syscall dispatcher self-test: PASS." qemu-boot.log
          grep -F "Gravity user-mode trap entry installed; user tasks are not implemented yet." qemu-boot.log
