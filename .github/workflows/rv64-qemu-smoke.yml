name: RV64 QEMU boot smoke test

on:
  push:
    branches: [main, "feat/lua-native-gui-foundation"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qemu-rv64-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf
      - name: Install RV64 cross linker and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc-riscv64-unknown-elf qemu-system-misc
      - name: Test bounded boot allocator
        run: make check-boot-alloc
      - name: Test physical memory map
        run: make check-memory-map
      - name: Test FDT memory discovery
        run: make check-fdt
      - name: Test native application package validation
        run: make check-app
      - name: Test native C++ LAP and LUAP installer
        run: make check-installer
      - name: Test SQLite-backed Xzuff App Hub service
        run: cargo test --manifest-path services/app-hub/Cargo.toml
      - name: Build RV64 payload
        run: make clean kernel-rv64 RISCV_PREFIX=riscv64-unknown-elf-
      - name: Boot through OpenSBI in QEMU
        shell: bash
        run: |
          set +e
          timeout 8s qemu-system-riscv64 \
            -machine virt -nographic -bios default \
            -kernel build/openxzuff-rv64.elf > qemu-boot.log 2>&1
          status=$?
          set -e
          # The kernel deliberately waits forever after printing its boot status.
          if [ "$status" -ne 124 ]; then
            cat qemu-boot.log
            echo "QEMU did not remain in the expected kernel idle loop (exit $status)."
            exit 1
          fi
          cat qemu-boot.log
          grep -F "OpenXzuff UI native kernel: RV64 entry reached." qemu-boot.log
          grep -F "Gravity FDT RAM discovery: PASS; usable bytes=" qemu-boot.log
          grep -F "Gravity boot allocator: initialized from reserved-safe RAM range." qemu-boot.log
          grep -F "Gravity syscall dispatcher self-test: PASS." qemu-boot.log
          grep -F "Gravity user-mode trap entry installed; user tasks are not implemented yet." qemu-boot.log

      - name: Assemble verified RV64 package
        run: |
          mkdir -p dist/openxzuff-rv64
          cp build/openxzuff-rv64.elf dist/openxzuff-rv64/
          cp docs/GAPP-FORMAT.md dist/openxzuff-rv64/
          cat > dist/openxzuff-rv64/BUILD-STATUS.txt <<'EOF'
          OpenXzuff UI / Gravity Kernel RV64 bring-up package
          Build target: RV64 QEMU/OpenSBI payload
          Included: early boot kernel, FDT RAM discovery, bounded boot allocator,
          physical memory map, syscall dispatcher self-test, GAPP metadata validator.
          Not a complete operating system. User-mode process execution, scheduler,
          framebuffer compositor, Lua VM integration, ART Minimal and Win32 Basic
          are not implemented by this package.
          EOF
          tar -czf dist/openxzuff-rv64.tar.gz -C dist openxzuff-rv64
      - name: Upload verified package artifact
        uses: actions/upload-artifact@v4
        with:
          name: openxzuff-rv64-${{ github.sha }}
          path: dist/openxzuff-rv64.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenXzuff UI ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/openxzuff-rv64.tar.gz
          fail_on_unmatched_files: true
