name: Lua and RV64 kernel checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax-check Lua sources
        run: find src tests -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Run UI tests
        run: lua5.4 tests/ui_spec.lua
  rv64-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RV64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      - name: Build minimal RV64 payload
        run: make kernel-rv64 RISCV_PREFIX=riscv64-unknown-elf-
