name: Lua UI checks

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Lua
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
      - name: Syntax-check Lua sources
        run: |
          find src tests -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Run UI tests
        run: lua5.4 tests/ui_spec.lua
