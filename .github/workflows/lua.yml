name: OpenXzuff native foundation checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax-check Lua sources
        run: find src tests runtime/lua -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Run UI tests
        run: lua5.4 tests/ui_spec.lua

  rust-sql-ai:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test retrieval library
        run: cargo test --manifest-path services/sql-ai/Cargo.toml

  cpp-ai-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check C++ AI boundary
        run: g++ -std=c++17 -Wall -Wextra -Werror -Iai/runtime/include -fsyntax-only ai/runtime/src/ai_runtime.cpp

  rv64-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install RV64 cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf
      - name: Build minimal RV64 payload
        run: make kernel-rv64 RISCV_PREFIX=riscv64-unknown-elf-
