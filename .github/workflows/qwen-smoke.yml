name: Real Qwen2.5 host inference smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qwen-cpu-inference:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install inference dependencies
        run: python -m pip install --upgrade pip torch transformers safetensors
      - name: Load Qwen2.5-0.5B and generate real output on CPU
        run: >-
          python ai/qwen/smoke_test.py
          --prompt "Reply in one short sentence: what is a microkernel?"
          --max-new-tokens 48
