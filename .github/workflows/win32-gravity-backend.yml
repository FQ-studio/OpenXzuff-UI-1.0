name: Win32 Gaming Gravity Backend Bridge

on:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'Kernel/include/openxzuff/kernel/**'
      - 'Kernel/src/syscall.cpp'
      - 'kernel/**'
      - 'win32-gaming/**'
      - 'scripts/build-kernel-rv64-s-mode.sh'
      - '.github/workflows/win32-gravity-backend.yml'
  push:
    branches:
      - main
      - 'feature/win32-gaming-gravity-port'
    paths:
      - 'CMakeLists.txt'
      - 'Kernel/include/openxzuff/kernel/**'
      - 'Kernel/src/syscall.cpp'
      - 'win32-gaming/**'
      - '.github/workflows/win32-gravity-backend.yml'

permissions:
  contents: read

jobs:
  host-bridge:
    name: Build and test Gravity host bridge (host mock)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build backend bridge tests
        run: cmake --build build --target win32-gravity-host-abi-test win32-gravity-kernel-backend-test --parallel 2

      - name: Run backend bridge tests
        run: ctest --test-dir build --output-on-failure -R 'win32-gravity-(host-abi-contract|kernel-backend-bridge)'

  rv64-user-adapter:
    name: Cross-compile the real RV64 U-mode adapter
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install RV64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm

      - name: Compile RV64 ecall adapter
        run: |
          set -euo pipefail
          mkdir -p build/win32-gravity-rv64
          clang++ --target=riscv64-unknown-elf \
            -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -ffreestanding -fno-exceptions -fno-rtti \
            -march=rv64imac -mabi=lp64 \
            -I win32-gaming/include \
            -c win32-gaming/src/gravity_kernel_backend_rv64.cpp \
            -o build/win32-gravity-rv64/gravity_kernel_backend_rv64.o
          llvm-objdump -d build/win32-gravity-rv64/gravity_kernel_backend_rv64.o > build/win32-gravity-rv64/adapter.dis
          test "$(grep -c '[[:space:]]ecall' build/win32-gravity-rv64/adapter.dis)" -ge 2
          grep -q 'xzfg_gravity_host_api_v1_bind_rv64' build/win32-gravity-rv64/adapter.dis
