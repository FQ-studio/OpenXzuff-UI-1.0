[package]
name = "xzuff-app-hub"
version = "0.1.0"
edition = "2021"
description = "SQLite-backed Xzuff App Hub API for LAP/LUAP packages"
license = "MIT"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
dotenvy = "0.15"
