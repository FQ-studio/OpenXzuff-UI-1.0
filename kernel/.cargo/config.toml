[build]
target = "riscv64gc-unknown-none-elf"

[target.riscv64gc-unknown-none-elf]
linker = "riscv64-unknown-elf-gcc"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-C", "link-arg=-Wl,-T,linker-riscv.ld",
  "-C", "link-arg=-Wl,--build-id=none",
  "-C", "link-arg=-Wl,-Map=build/gravity-kernel.map"
]
